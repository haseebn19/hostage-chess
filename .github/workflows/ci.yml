name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test with Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=xml --cov-report=html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Coverage Summary
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          print("| Metric | Coverage |")
          print("|--------|----------|")
          print(f"| Lines | {float(root.get('line-rate', 0)) * 100:.2f}% |")
          print(f"| Branches | {float(root.get('branch-rate', 0)) * 100:.2f}% |")
          PY

  browser:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -e ".[dev,browser]"
      - run: playwright install --with-deps chromium
      - run: pytest tests/test_browser.py

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, browser]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install build
      - run: python -m build

      - name: Test Assets from the Installed Wheel
        run: |
          pip install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_static.py" -o addopts="" -q
